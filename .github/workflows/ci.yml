name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, test and build
    runs-on: [self-hosted, sbk-small]
    timeout-minutes: 10
    # Public repo: don't run forked PR code on the self-hosted pool.
    # Same-repo PRs and pushes to main still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Doctor score
        run: npm run doctor:check

      - name: Build
        run: npm run build
        env:
          # Placeholder required by Vite at build time. Override in repo secrets
          # for real deployments; CI builds do not need a live backend URL to
          # succeed, they only validate type and bundle correctness.
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || 'https://example.convex.cloud' }}
